name: Build Firmware

on:
  push:
    paths:
      - 'platformio.ini'
      - 'firmware/**'
      - '.github/workflows/build_firmware.yml'
  pull_request:
    paths:
      - 'platformio.ini'
      - 'firmware/**'
      - '.github/workflows/build_firmware.yml'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate version info
        id: version
        run: |
          # Get version from the latest tag, fallback to 0.0.0 if no tag
          RAW_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          VERSION=$(echo "$RAW_VERSION" | sed -E 's/[^0-9]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          
          # Short commit hash
          COMMIT_HASH=$(git rev-parse --short HEAD)

          # GitHub build number
          BUILD_NUMBER=${GITHUB_RUN_NUMBER}

          # Composite version string
          FULL_VERSION="${VERSION}+build${BUILD_NUMBER}-${COMMIT_HASH}"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV

      - name: Write version to header
        run: |
          cat <<EOF > firmware/src/version_info.h
          #pragma once
          #define FIRMWARE_VERSION         "${VERSION}"
          #define FIRMWARE_COMMIT_HASH     "${COMMIT_HASH}"
          #define FIRMWARE_BUILD_NUM       "${BUILD_NUMBER}"
          #define FIRMWARE_VERSION_STRING  "${FULL_VERSION}"
          EOF

      - name: Echo version info
        run: |
          cat firmware/src/version_info.h

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: pio run -e cheap-yellow-display

      - name: Create version JSON file for Cheap Yellow Display
        run: |
          mkdir -p .pio/build/cheap-yellow-display
          cat <<EOF > .pio/build/cheap-yellow-display/version.json
          {
            "version": "$VERSION",
            "commit_hash": "$COMMIT_HASH",
            "build_number": "$BUILD_NUMBER",
            "full_version": "$FULL_VERSION"
          }
          EOF

      - name: Rename cheap yellow display firmware files with version
        run: |
          mv .pio/build/cheap-yellow-display/bootloader.bin .pio/build/cheap-yellow-display/cheap-yellow-display-bootloader-${FULL_VERSION}.bin
          mv .pio/build/cheap-yellow-display/firmware.bin .pio/build/cheap-yellow-display/cheap-yellow-display-firmware-${FULL_VERSION}.bin
          mv .pio/build/cheap-yellow-display/partitions.bin .pio/build/cheap-yellow-display/cheap-yellow-display-partitions-${FULL_VERSION}.bin
          mv .pio/build/cheap-yellow-display/version.json .pio/build/cheap-yellow-display/cheap-yellow-display-version-${FULL_VERSION}.json

      - name: Upload CYD Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyd-firmware
          path: |
            .pio/build/cheap-yellow-display/cheap-yellow-display-bootloader-*.bin
            .pio/build/cheap-yellow-display/cheap-yellow-display-firmware-*.bin
            .pio/build/cheap-yellow-display/cheap-yellow-display-partitions-*.bin
            .pio/build/cheap-yellow-display/cheap-yellow-display-version-*.json
          overwrite: true
          if-no-files-found: error

  upload-to-release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download CYD firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: cyd-firmware
          path: cyd-firmware

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            cyd-firmware/cheap-yellow-display-bootloader-*.bin
            cyd-firmware/cheap-yellow-display-firmware-*.bin
            cyd-firmware/cheap-yellow-display-partitions-*.bin
            cyd-firmware/cheap-yellow-display-version-*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
