; Root PlatformIO project configuration for opening the repository root in PlatformIO IDE.
; The firmware sources remain under firmware/, but the IDE can now detect the project
; directly from the workspace root.

[platformio]
default_envs = cheap-yellow-display
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
test_dir = firmware/test
data_dir = firmware/data
build_dir = .pio

[common]
platform = espressif32@6.11.0
framework = arduino
monitor_speed = 115200
build_flags =
  -std=c++17
  -std=gnu++17
  -O3
  -ffast-math
  -Wl,-Map,output.map
build_unflags =
  -std=gnu++11
  -fno-rtti
lib_deps =
  bblanchon/ArduinoJson@^7.4.1
  SPI
  https://github.com/bitbank2/JPEGDEC#1.7.0
  adafruit/Adafruit seesaw Library
  adafruit/Adafruit BusIO
  Wire
  littlefs
monitor_filters =
  esp32_exception_decoder

[esp32_common]
platform = ${common.platform}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
build_unflags = ${common.build_unflags}
lib_deps = ${common.lib_deps}
monitor_filters = ${common.monitor_filters}

[env:cheap-yellow-display]
extends = esp32_common
board = esp-wrover-kit
board_build.filesystem = littlefs
build_src_filter =
  +<*>
  -<Input/TouchKeyboardV2.cpp>
  -<Input/TouchKeyboard.cpp>
  +<Input/cyd_touch/>
build_flags =
  ${common.build_flags}
  -DHARDWARE_VERSION_STRING=\"CheapYellowDisplay\"
  -DCYD_SKIP_AUTO_TAPE_LOADER=1
  -DCYD_NO_TIME_TRAVEL=1
  -DCYD_NO_EMULATOR_MENU=1
  -DSPECTRUM_48K_ONLY=1
  -DCYD_EMULATOR_X_RIGHT=0
  -DCYD_EMULATOR_X_LEFT=32
  -DCYD_EMULATOR_W=288
  -DCYD_EMULATOR_H=214
  -DCYD_EMULATOR_Y=0
  -DCYD_SPECTRUM_BORDER_TOP=10
  -DCYD_SPECTRUM_BORDER_BOTTOM=12
  -DCYD_COMMAND_ROW_H=8
  -DCYD_KEYBOARD_ROW_H=26
  -DCYD_TOUCH_KEYBOARD=1
  -DCYD_TAPE_BUFFER_SIZE=98304
  -DCYD_TAPE_BUFFER_MIN=49152
  -DCYD_SERIAL_TX_BUFFER=4096
  -DCYD_SERIAL_RX_BUFFER=4096
  -DCYD_TOUCH_CS=33
  -DCYD_TOUCH_IRQ=36
  -DCYD_TOUCH_CLK=25
  -DCYD_TOUCH_MISO=39
  -DCYD_TOUCH_MOSI=32
  -DTFT_ILI9341
  ; Landscape orientation with USB on the right.
  ; The panel appears upside-down with the current setting, so use inverted landscape.
  -DTFT_ILI9341_ROTATION=ILI9341_ROTATION_PORTRAIT
  ; Keep touch coordinates aligned with the same orientation seen by the TFT.
  -DCYD_TOUCH_ROTATION=ILI9341_ROTATION_PORTRAIT
  ; For alternate mounting, use one of:
  ;   ILI9341_ROTATION_PORTRAIT
  ;   ILI9341_ROTATION_PORTRAIT_INVERTED
  ;   ILI9341_ROTATION_LANDSCAPE_NORMAL
  ;   ILI9341_ROTATION_LANDSCAPE_INVERTED
  -DTFT_SPI_FREQUENCY=SPI_MASTER_FREQ_40M
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=240
  -DTFT_SCLK=GPIO_NUM_14
  -DTFT_MISO=GPIO_NUM_12
  -DTFT_MOSI=GPIO_NUM_13
  -DTFT_RST=GPIO_NUM_NC
  -DTFT_DC=GPIO_NUM_2
  -DTFT_CS=GPIO_NUM_15
  -DTFT_BL=GPIO_NUM_21
  -DTFT_BACKLIGHT_ON=HIGH
  -DBUZZER_GPIO_NUM=GPIO_NUM_26
  -DUSE_SDCARD
  -DSD_CARD_SPI_HOST=SPI3_HOST
  -DSD_CARD_MISO=GPIO_NUM_19
  -DSD_CARD_MOSI=GPIO_NUM_23
  -DSD_CARD_CLK=GPIO_NUM_18
  -DSD_CARD_CS=GPIO_NUM_5
  -DSD_CARD_MAX_FREQ_KHZ=20000
